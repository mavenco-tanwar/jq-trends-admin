<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" fill="none" width="280" height="64">
  <defs>
    <linearGradient id="roseGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CF9584" />
      <stop offset="50%" stop-color="#B77A68" />
      <stop offset="100%" stop-color="#9A6050" />
    </linearGradient>
    <linearGradient id="blushGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8B8B5" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#C98282" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <!-- Monogram Emblem Circle -->
  <g transform="translate(6, 6)">
    <circle cx="26" cy="26" r="25" stroke="url(#roseGoldGrad)" stroke-width="1.2" fill="#FFFDFC" />
    <circle cx="26" cy="26" r="22" stroke="#E8DED8" stroke-width="0.75" stroke-dasharray="2 2" fill="none" />
    
    <!-- Stylized JQ Monogram -->
    <!-- Letter J -->
    <path d="M22 17 V31 C22 34 20 36 17 36 C15.5 36 14.5 35 14 34" stroke="url(#roseGoldGrad)" stroke-width="2" stroke-linecap="round" fill="none" />
    <!-- Letter Q -->
    <ellipse cx="29" cy="25" rx="7.5" ry="9" stroke="#111111" stroke-width="1.8" fill="none" />
    <path d="M33 30 L38 35" stroke="url(#roseGoldGrad)" stroke-width="2" stroke-linecap="round" />
    
    <!-- Delicate Diamond Accent -->
    <polygon points="26,10 27.5,12.5 26,15 24.5,12.5" fill="url(#roseGoldGrad)" />
  </g>

  <!-- Brand Typography -->
  <g transform="translate(68, 8)">
    <!-- JQ TRENDS -->
    <text x="0" y="27" font-family="'Playfair Display', 'Cormorant Garamond', serif" font-size="24" font-weight="700" letter-spacing="3" fill="#111111">
      JQ <tspan fill="url(#roseGoldGrad)" font-weight="500">TRENDS</tspan>
    </text>
    
    <!-- Tagline -->
    <text x="1" y="42" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="7.5" font-weight="500" letter-spacing="3.2" fill="#777777">
      STYLE THAT SPEAKS YOU
    </text>
    
    <!-- Subtle divider dots -->
    <circle cx="160" cy="40" r="1" fill="#B77A68" />
  </g>
</svg>
